<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="70" font-size="34" fill="#17324d" text-anchor="start">P29补充：中国电力监控系统安全分区（概念图）</text><text x="60" y="125" font-size="25" fill="#17324d" text-anchor="start">依据第27号令第4–6条；按业务功能与要求部署，不按设备名称机械归类。</text><text x="70" y="220" font-size="30" fill="#17324d" text-anchor="start">生产控制区</text><rect x="70" y="260" width="690" height="115" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="90" y="298" font-size="26" fill="#17324d" text-anchor="start">安全I区：实时监控一次设备</text><rect x="70" y="420" width="690" height="115" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="90" y="458" font-size="26" fill="#17324d" text-anchor="start">安全II区：紧密交互、影响较大但不直接控制</text><text x="820" y="220" font-size="30" fill="#17324d" text-anchor="start">管理信息区</text><rect x="820" y="260" width="690" height="115" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="840" y="298" font-size="26" fill="#17324d" text-anchor="start">安全III区：运行指挥、分析决策</text><rect x="820" y="420" width="690" height="115" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="840" y="458" font-size="26" fill="#17324d" text-anchor="start">安全IV区：其他业务</text><rect x="70" y="650" width="1440" height="90" rx="10" fill="#fff1df" stroke="#9ab2c8"/><text x="90" y="688" font-size="25" fill="#17324d" text-anchor="start">特定终端或非专用网络接入：按第6条设安全接入区；并非允许任意公网直连。</text><text x="70" y="805" font-size="23" fill="#17324d" text-anchor="start">来源：R15。仅说明分区概念，不提供通信互联许可，不作为工程施工或合规认证依据。</text></g></svg>