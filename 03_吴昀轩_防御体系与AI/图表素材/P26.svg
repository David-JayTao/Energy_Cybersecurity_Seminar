<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#447394"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="65" font-size="34" fill="#17324d" text-anchor="start">P26  AI先做辅助检测：从规则匹配到学习时序关系</text><text x="60" y="115" font-size="25" fill="#527189" text-anchor="start">AI的价值在补充检测线索，部署效果必须评测。</text><rect x="80" y="195" width="420" height="100" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="100" y="233" font-size="25" fill="#17324d" text-anchor="start">规则：已知限制</text><path d="M500,245 L800,440" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="658.0" y="330.5" font-size="19" fill="#17324d" text-anchor="start"></text><rect x="80" y="355" width="420" height="100" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="100" y="393" font-size="25" fill="#17324d" text-anchor="start">机器学习：时序特征</text><path d="M500,405 L800,440" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="658.0" y="410.5" font-size="19" fill="#17324d" text-anchor="start"></text><rect x="80" y="515" width="420" height="100" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="100" y="553" font-size="25" fill="#17324d" text-anchor="start">物理模型：过程约束</text><path d="M500,565 L800,440" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="658.0" y="490.5" font-size="19" fill="#17324d" text-anchor="start"></text><rect x="800" y="385" width="610" height="110" rx="10" fill="#fff1df" stroke="#9ab2c8"/><text x="820" y="423" font-size="25" fill="#17324d" text-anchor="start">关联证据 → 人工复核</text><text x="800" y="570" font-size="25" fill="#17324d" text-anchor="start">模型输出是线索；运行人员确认后分级处置。</text><text x="60" y="850" font-size="19" fill="#657a8d" text-anchor="start">来源：R18 