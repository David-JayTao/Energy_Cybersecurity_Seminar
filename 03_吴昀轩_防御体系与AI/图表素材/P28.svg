<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#447394"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="65" font-size="34" fill="#17324d" text-anchor="start">P28  大模型与安全智能体：先限定权限，再讨论自动化</text><text x="60" y="115" font-size="25" fill="#527189" text-anchor="start">语言能力不等于可直接控制物理系统的可信性。</text><rect x="65.0" y="300" width="310.0" height="160" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="85.0" y="338" font-size="25" fill="#17324d" text-anchor="start">只读证据检索</text><text x="80.0" y="270" font-size="23" fill="#d17d25" text-anchor="start">01</text><path d="M375.0,380 L405.0,380" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="398.0" y="368.0" font-size="19" fill="#17324d" text-anchor="start"></text><rect x="410.0" y="300" width="310.0" height="160" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="430.0" y="338" font-size="25" fill="#17324d" text-anchor="start">生成有来源建议</text><text x="425.0" y="270" font-size="23" fill="#d17d25" text-anchor="start">02</text><path d="M720.0,380 L750.0,380" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="743.0" y="368.0" font-size="19" fill="#17324d" text-anchor="start"></text><rect x="755.0" y="300" width="310.0" height="160" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="775.0" y="338" font-size="25" fill="#17324d" text-anchor="start">人工与策略复核</text><text x="770.0" y="270" font-size="23" fill="#d17d25" text-anchor="start">03</text><path d="M1065.0,380 L1095.0,380" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="1088.0" y="368.0" font-size="19" fill="#17324d" text-anchor="start"></text><rect x="1100.0" y="300" width="310.0" height="160" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="1120.0" y="338" font-size="25" fill="#17324d" text-anchor="start">受控执行系统</text><text x="1115.0" y="270" font-size="23" fill="#d17d25" text-anchor="start">04</text><text x="70" y="580" font-size="25" fill="#17324d" text-anchor="start">模型失效时保留规则、人工与运行兜底</text><text x="60" y="850" font-size="19" fill="#657a8d" text-anchor="start">来源：R21 / R22 / R24  ｜本组重绘示意；完整书目与证据边界见逐页材料。</text></g></svg>