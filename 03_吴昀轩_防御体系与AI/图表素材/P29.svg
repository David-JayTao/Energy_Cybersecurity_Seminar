<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#447394"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="65" font-size="34" fill="#17324d" text-anchor="start">P29  本组分层方案：控制路径、监测路径、恢复路径分别设计</text><text x="60" y="115" font-size="25" fill="#527189" text-anchor="start">安全层不能引入共同失效点。</text><rect x="80" y="170" width="750" height="90" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="100" y="208" font-size="25" fill="#17324d" text-anchor="start">业务 / 第三方：身份与供应链</text><path d="M380,260 L380,290" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="388.0" y="263.0" font-size="19" fill="#17324d" text-anchor="start"></text><path d="M480,290 L480,260" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="488.0" y="263.0" font-size="19" fill="#17324d" text-anchor="start"></text><path d="M830,215 L1030,400" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" stroke-dasharray="9 7"/><text x="938.0" y="295.5" font-size="19" fill="#17324d" text-anchor="start">审计</text><rect x="80" y="295" width="750" height="90" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="100" y="333" font-size="25" fill="#17324d" text-anchor="start">合规边界：接入与受控交换</text><path d="M380,385 L380,415" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="388.0" y="388.0" font-size="19" fill="#17324d" text-anchor="start"></text><path d="M480,415 L480,385" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="488.0" y="388.0" font-size="19" fill="#17324d" text-anchor="start"></text><path d="M830,340 L1030,400" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" stroke-dasharray="9 7"/><text x="938.0" y="358.0" font-size="19" fill="#17324d" text-anchor="start"></text><rect x="80" y="420" width="750" height="90" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="100" y="458" font-size="25" fill="#17324d" text-anchor="start">运行控制：授权、配置与审计</text><path d="M380,510 L380,540" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="388.0" y="513.0" font-size="19" fill="#17324d" text-anchor="start"></text><path d="M480,540 L480,510" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="488.0" y="513.0" font-size="19" fill="#17324d" text-anchor="start"></text><path d="M830,465 L1030,400" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" stroke-dasharray="9 7"/><text x="938.0" y="420.5" font-size="19" fill="#17324d" text-anchor="start"></text><rect x="80" y="545" width="750" height="90" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="100" y="583" font-size="25" fill="#17324d" text-anchor="start">现场设备：本地控制与保护</text><path d="M830,590 L1030,400" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" stroke-dasharray="9 7"/><text x="938.0" y="483.0" font-size="19" fill="#17324d" text-anchor="start"></text><rect x="1030" y="330" width="450" height="135" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="1050" y="368" font-size="25" fill="#17324d" text-anchor="start">旁路监测：规则 / AI / 物理校验</text><rect x="1030" y="540" width="450" height="110" rx="10" fill="#fff1df" stroke="#9ab2c8"/><text x="1050" y="578" font-size="25" fill="#17324d" text-anchor="start">安全与运行人员联合响应</text><path d="M1250,465 L1250,540" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="1258.0" y="490.5" font-size="19" fill="#17324d" text-anchor="start">证据</text><rect x="80" y="715" width="1400" height="70" rx="10" fill="#e8f4ed" stroke="#9ab2c8"/><text x="100" y="753" font-size="25" fill="#17324d" text-anchor="start">贯穿全层的恢复路径：可信备份、备用通信、现场操作、联合演练</text><text x="60" y="850" font-size="19" fill="#657a8d" text-anchor="start">来源：R01 / R12 / R15 / R22 / R23  ｜本组重绘示意；完整书目与证据边界见逐页材料。</text></g></svg>