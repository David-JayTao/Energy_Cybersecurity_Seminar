<text x="64" y="55.0" font-size="20" fill="#637383" font-weight="400" text-anchor="start">能源 × 网络安全  /  刘酝潇  /  P20</text>
<text x="64" y="115.0" font-size="38" fill="#173044" font-weight="700" text-anchor="start">下一步要解决：怎样识别不当操作，怎样可靠恢复？</text>
<text x="64" y="160.0" font-size="24" fill="#637383" font-weight="400" text-anchor="start">本组提出的问题｜第三部分据此选择可解释、可验证的技术</text>
<line x1="64" y1="812" x2="1536" y2="812" stroke="#637383" stroke-width="1"/>
<text x="64" y="848.0" font-size="20" fill="#637383" font-weight="400" text-anchor="start">来源：R01 / R02 / R07  ·  完整定位见逐页文案与本部分书目</text>
<text x="64" y="879.0" font-size="18" fill="#637383" font-weight="400" text-anchor="start">2026-11-10  ·  本组重绘；图中比例不代表时间、概率或电气容量</text>
<rect x="64" y="235" width="710" height="400" rx="14" fill="white" stroke="#246ca6" stroke-width="2"/>
<text x="86" y="278.0" font-size="27" fill="#246ca6" font-weight="700" text-anchor="start">怎样识别不当操作？</text>
<text x="86" y="321.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">账号与会话：谁在用？</text>
<text x="86" y="355.8" font-size="24" fill="#173044" font-weight="400" text-anchor="start">对象与权限：能操作哪里？</text>
<text x="86" y="390.6" font-size="24" fill="#173044" font-weight="400" text-anchor="start">运行授权：这次操作该不该发生？</text>
<text x="86" y="425.4" font-size="24" fill="#173044" font-weight="400" text-anchor="start">设备反馈：现场结果是否符合预期？</text>
<rect x="826" y="235" width="710" height="400" rx="14" fill="white" stroke="#b95822" stroke-width="2"/>
<text x="848" y="278.0" font-size="27" fill="#b95822" font-weight="700" text-anchor="start">怎样支撑可靠恢复？</text>
<text x="848" y="321.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">受影响范围：哪些能力还可信？</text>
<text x="848" y="355.8" font-size="24" fill="#173044" font-weight="400" text-anchor="start">运行选择：继续、降级还是停运？</text>
<text x="848" y="390.6" font-size="24" fill="#173044" font-weight="400" text-anchor="start">恢复条件：账号、配置、通信、现场</text>
<text x="848" y="425.4" font-size="24" fill="#173044" font-weight="400" text-anchor="start">重启验证：先证明能够安全运行</text>
<rect x="64" y="676" width="1472" height="66" rx="14" fill="#edf7f3" stroke="#16826c" stroke-width="2"/>
<text x="88" y="718.0" font-size="27" fill="#16826c" font-weight="700" text-anchor="start">验证方向：可追溯的异常证据　＋　可信的现场状态　＋　实际恢复演练</text>
<text x="64" y="785.0" font-size="23" fill="#637383" font-weight="400" text-anchor="start">建议来自案例分析；不作“某项技术当年部署就一定能阻止事件”的保证。</text>
