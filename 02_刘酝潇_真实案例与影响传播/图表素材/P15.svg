<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>P15 断路器分闸，何时会让下游用户失电？</title><desc>上下对照同一简化径向馈线：合闸连续、分闸出现真实间隙；备用路径以灰色虚线表示未投入。控制箭头不得画成电能流。</desc>
