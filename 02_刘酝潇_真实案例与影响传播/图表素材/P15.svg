<text x="64" y="746.0" font-size="23" fill="#637383" font-weight="400" text-anchor="start">能否转供取决于备用路径、容量与安全操作条件；保护和联锁不能默认识别所有非授权分闸。</text>
<text x="64" y="783.0" font-size="23" fill="#637383" font-weight="400" text-anchor="start">绿色／灰色粗线是电气连接，不是通信流量；本图不推算2015年的停电规模。</text>
