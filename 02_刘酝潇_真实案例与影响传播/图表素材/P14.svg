<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>P14 从业务网络入侵到非授权控制操作</title><desc>传播路径图分“研究归纳”和“报告支持的控制结果”；边界标注身份、对象、操作权限；不加入漏洞、命令格式或具体型号。</desc>
<defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#246ca6"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#b95822"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#16826c"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#637383"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#b43a42"/></marker></defs>
<rect width="1600" height="900" fill="#fafcfd"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .body{font-size:26px}</style>
<text x="64" y="55.0" font-size="20" fill="#637383" font-weight="400" text-anchor="start">能源 × 网络安全  /  刘酝潇  /  P14</text>
<text x="64" y="115.0" font-size="38" fill="#173044" font-weight="700" text-anchor="start">从业务网络入侵到非授权控制操作</text>
<text x="64" y="160.0" font-size="24" fill="#637383" font-weight="400" text-anchor="start">按报告归纳共同机制｜访问方式存在差异，不把多家企业拼成同一取证链</text>
<line x1="64" y1="812" x2="1536" y2="812" stroke="#637383" stroke-width="1"/>
<text x="64" y="848.0" font-size="20" fill="#637383" font-weight="400" text-anchor="start">来源：R02 / R03 / R04  ·  完整定位见逐页文案与本部分书目</text>
<text x="64" y="879.0" font-size="18" fill="#637383" font-weight="400" text-anchor="start">2026-11-10  ·  本组重绘；图中比例不代表时间、概率或电气容量</text>
<rect x="64" y="215" width="700" height="360" rx="14" fill="#edf5fc" stroke="#246ca6" stroke-width="2" stroke-dasharray="10 7"/>
<text x="86" y="255.0" font-size="27" fill="#246ca6" font-weight="700" text-anchor="start">研究归纳：如何获得运行环境访问</text>
<rect x="86" y="310" width="292" height="180" rx="14" fill="white" stroke="#246ca6" stroke-width="2"/>
<text x="108" y="353.0" font-size="27" fill="#246ca6" font-weight="700" text-anchor="start">业务网络立足</text>
<text x="108" y="396.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">钓鱼等入侵活动</text>
<text x="108" y="430.8" font-size="24" fill="#173044" font-weight="400" text-anchor="start">非每步均有公开日志</text>
<rect x="446" y="310" width="292" height="180" rx="14" fill="white" stroke="#246ca6" stroke-width="2"/>
<text x="468" y="353.0" font-size="27" fill="#246ca6" font-weight="700" text-anchor="start">凭据与远程访问</text>
<text x="468" y="396.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">利用已有接入能力</text>
<text x="468" y="430.8" font-size="24" fill="#173044" font-weight="400" text-anchor="start">账号权限限制范围</text>
<line x1="378" y1="397" x2="444" y2="397" stroke="#246ca6" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#blue)"/>
<rect x="816" y="215" width="720" height="360" rx="14" fill="#fff4ed" stroke="#b95822" stroke-width="2"/>
<text x="838" y="255.0" font-size="27" fill="#b95822" font-weight="700" text-anchor="start">报告支持：实际控制行为与后果</text>
<rect x="838" y="310" width="300" height="180" rx="14" fill="white" stroke="#b95822" stroke-width="2"/>
<text x="860" y="353.0" font-size="27" fill="#b95822" font-weight="700" text-anchor="start">现有控制软件／HMI</text>
<text x="860" y="396.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">攻击者执行</text>
<text x="860" y="430.8" font-size="24" fill="#173044" font-weight="400" text-anchor="start">非授权控制操作</text>
<rect x="1196" y="310" width="315" height="180" rx="14" fill="white" stroke="#b95822" stroke-width="2"/>
<text x="1218" y="353.0" font-size="27" fill="#b95822" font-weight="700" text-anchor="start">开关动作与停电</text>
<text x="1218" y="396.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">现场状态发生改变</text>
<text x="1218" y="430.8" font-size="24" fill="#173044" font-weight="400" text-anchor="start">供电路径受到影响</text>
<line x1="764" y1="397" x2="836" y2="397" stroke="#246ca6" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#blue)"/>
<line x1="1138" y1="397" x2="1194" y2="397" stroke="#b95822" stroke-width="3" marker-end="url(#orange)"/>
<rect x="64" y="625" width="1472" height="100" rx="14" fill="white" stroke="#637383" stroke-width="2"/>
<text x="86" y="668.0" font-size="27" fill="#637383" font-weight="700" text-anchor="start">能连通 ≠ 能操作；功能正常 ≠ 该次操作获得合法授权</text>
<text x="86" y="711.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">逐项核实：网络可达范围、身份与会话、目标对象及操作能力</text>
<text x="64" y="761.0" font-size="23" fill="#637383" font-weight="400" text-anchor="start">虚线：研究重建与跨域关系；实线：报告支持的控制过程。未绘制具体漏洞、协议字段或设备型号。</text>
</svg>