<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#447394"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="65" font-size="34" fill="#17324d" text-anchor="start">P14  2015传播链：有效权限把IT入侵连接到OT操作</text><text x="60" y="115" font-size="25" fill="#527189" text-anchor="start">导致停电的是控制链被使用，而非软件名称本身。</text><rect x="65.0" y="300" width="241.0" height="160" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="85.0" y="338" font-size="25" fill="#17324d" text-anchor="start">业务网络与凭据</text><text x="80.0" y="270" font-size="23" fill="#d17d25" text-anchor="start">01</text><path d="M306.0,380 L336.0,380" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="329.0" y="368.0" font-size="19" fill="#17324d" text-anchor="start"></text><rect x="341.0" y="300" width="241.0" height="160" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="361.0" y="338" font-size="25" fill="#17324d" text-anchor="start">远程访问边界</text><text x="356.0" y="270" font-size="23" fill="#d17d25" text-anchor="start">02</text><path d="M582.0,380 L612.0,380" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="605.0" y="368.0" font-size="19" fill="#17324d" text-anchor="start"></text><rect x="617.0" y="300" width="241.0" height="160" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="637.0" y="338" font-size="25" fill="#17324d" text-anchor="start">运行控制系统</text><text x="632.0" y="270" font-size="23" fill="#d17d25" text-anchor="start">03</text><path d="M858.0,380 L888.0,380" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="881.0" y="368.0" font-size="19" fill="#17324d" text-anchor="start"></text><rect x="893.0" y="300" width="241.0" height="160" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="913.0" y="338" font-size="25" fill="#17324d" text-anchor="start">断路器动作</text><text x="908.0" y="270" font-size="23" fill="#d17d25" text-anchor="start">04</text><path d="M1134.0,380 L1164.0,380" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="1157.0" y="368.0" font-size="19" fill="#17324d" text-anchor="start"></text><rect x="1169.0" y="300" width="241.0" height="160" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="1189.0" y="338" font-size="25" fill="#17324d" text-anchor="start">配电用户失电</text><text x="1184.0" y="270" font-size="23" fill="#d17d25" text-anchor="start">05</text><text x="70" y="580" font-size="25" fill="#17324d" text-anchor="start">图为多报告综合示意，不是单家企业取证拓扑</text><text x="280" y="515" font-size="19" fill="#17324d" text-anchor="start">凭据与权限</text><text x="556" y="515" font-size="19" fill="#17324d" text-anchor="start">有效控制路径</text><text x="832" y="515" font-size="19" fill="#17324d" text-anchor="start">不当分闸</text><text x="1108" y="515" font-size="19" fill="#17324d" text-anchor="start">电气后果</text><text x="60" y="850" font-size="19" fill="#657a8d" text-anchor="start">来源：R02 / R04  ｜本组重绘示意；完整书目与证据边界见逐页材料。</text></g></svg>