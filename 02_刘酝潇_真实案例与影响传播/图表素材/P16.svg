<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>P16 恢复供电之后，远程控制仍可能不可用</title><desc>上层区分停电、远控受阻、客户联系受阻；下层并列供电恢复与控制恢复。箭头不暗示具体时间比例，启示单列。</desc>
<defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#246ca6"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#b95822"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#16826c"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#637383"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#b43a42"/></marker></defs>
<rect width="1600" height="900" fill="#fafcfd"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .body{font-size:26px}</style>
<text x="64" y="55.0" font-size="20" fill="#637383" font-weight="400" text-anchor="start">能源 × 网络安全  /  刘酝潇  /  P16</text>
<text x="64" y="115.0" font-size="38" fill="#173044" font-weight="700" text-anchor="start">恢复供电之后，远程控制仍可能不可用</text>
<text x="64" y="160.0" font-size="24" fill="#637383" font-weight="400" text-anchor="start">事件报告中的不同作用｜不同企业的破坏细节不合并为同一站点的完整经历</text>
<line x1="64" y1="812" x2="1536" y2="812" stroke="#637383" stroke-width="1"/>
<text x="64" y="848.0" font-size="20" fill="#637383" font-weight="400" text-anchor="start">来源：R02 / R04 / R01  ·  完整定位见逐页文案与本部分书目</text>
<text x="64" y="879.0" font-size="18" fill="#637383" font-weight="400" text-anchor="start">2026-11-10  ·  本组重绘；图中比例不代表时间、概率或电气容量</text>
<rect x="64" y="220" width="468" height="155" rx="14" fill="white" stroke="#b95822" stroke-width="2"/>
<text x="86" y="263.0" font-size="27" fill="#b95822" font-weight="700" text-anchor="start">造成供电中断</text>
<text x="86" y="306.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">控制操作 → 开关动作</text>
<text x="86" y="340.8" font-size="24" fill="#173044" font-weight="400" text-anchor="start">供电路径被切断</text>
<rect x="566" y="220" width="468" height="155" rx="14" fill="white" stroke="#246ca6" stroke-width="2"/>
<text x="588" y="263.0" font-size="27" fill="#246ca6" font-weight="700" text-anchor="start">妨碍远程恢复</text>
<text x="588" y="306.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">主机与部分通信设备受损</text>
<text x="588" y="340.8" font-size="24" fill="#173044" font-weight="400" text-anchor="start">远程工具难以继续使用</text>
<rect x="1068" y="220" width="468" height="155" rx="14" fill="white" stroke="#637383" stroke-width="2"/>
<text x="1090" y="263.0" font-size="27" fill="#637383" font-weight="700" text-anchor="start">影响客户联系</text>
<text x="1090" y="306.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">电话服务受到干扰</text>
<text x="1090" y="340.8" font-size="24" fill="#173044" font-weight="400" text-anchor="start">不是分闸的必要步骤</text>
<text x="64" y="430.0" font-size="26" fill="#173044" font-weight="700" text-anchor="start">恢复进程：终点不同，不绘制未经证实的持续时间比例</text>
<rect x="64" y="475" width="620" height="140" rx="14" fill="white" stroke="#16826c" stroke-width="2"/>
<text x="86" y="518.0" font-size="27" fill="#16826c" font-weight="700" text-anchor="start">供电服务恢复〔报告事实〕</text>
<text x="86" y="561.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">人工等方式恢复送电</text>
<text x="86" y="595.8" font-size="24" fill="#173044" font-weight="400" text-anchor="start">依赖人员、现场操作及通信条件</text>
<rect x="824" y="475" width="712" height="140" rx="14" fill="white" stroke="#246ca6" stroke-width="2"/>
<text x="846" y="518.0" font-size="27" fill="#246ca6" font-weight="700" text-anchor="start">控制能力恢复〔报告事实＋本组启示〕</text>
<text x="846" y="561.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">供电恢复后，自动化仍受限制〔事实〕</text>
<text x="846" y="595.8" font-size="24" fill="#173044" font-weight="400" text-anchor="start">需重建账号、配置、通信并核验〔启示〕</text>
<rect x="64" y="670" width="1472" height="58" rx="14" fill="#fff4ed" stroke="#b95822" stroke-width="2"/>
<text x="88" y="708.0" font-size="25" fill="#b95822" font-weight="700" text-anchor="start">恢复送电不证明远程控制已经可信；人工恢复也必须满足现场安全条件。</text>
<text x="64" y="761.0" font-size="23" fill="#637383" font-weight="400" text-anchor="start">固件破坏、主机擦除与电话干扰分开叙述，不把KillDisk写成所有破坏行为的统一名称。</text>
</svg>