<text x="64" y="55.0" font-size="20" fill="#637383" font-weight="400" text-anchor="start">能源 × 网络安全  /  刘酝潇  /  P19</text>
<text x="64" y="115.0" font-size="38" fill="#173044" font-weight="700" text-anchor="start">两条路径的分界：设备被操作，还是运营方停运？</text>
<text x="64" y="160.0" font-size="24" fill="#637383" font-weight="400" text-anchor="start">按主要机制比较｜实际事件可兼有控制异常与主动停运，表格不是穷尽分类</text>
<line x1="64" y1="812" x2="1536" y2="812" stroke="#637383" stroke-width="1"/>
<text x="64" y="848.0" font-size="20" fill="#637383" font-weight="400" text-anchor="start">来源：R02 / R07 / R08  ·  完整定位见逐页文案与本部分书目</text>
<text x="64" y="879.0" font-size="18" fill="#637383" font-weight="400" text-anchor="start">2026-11-10  ·  本组重绘；图中比例不代表时间、概率或电气容量</text>
<rect x="64" y="215" width="1472" height="65" rx="14" fill="#173044" stroke="#173044" stroke-width="2"/>
