<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>P19 两条路径的分界：设备被操作，还是运营方停运？</title><desc>两列对照表依次列初始系统、改变运行的人、关键机制、结果及恢复；未知不填“绝对没有”。</desc>
