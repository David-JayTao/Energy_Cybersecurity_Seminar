<text x="390" y="330.0" font-size="24" fill="#246ca6" font-weight="400" text-anchor="start">业务网络入侵、凭据与远程访问</text>
<text x="980" y="330.0" font-size="24" fill="#b95822" font-weight="400" text-anchor="start">业务IT系统受到勒索</text>
<rect x="64" y="365" width="1472" height="85" rx="14" fill="white" stroke="#d3dfe6" stroke-width="2"/>
<text x="86" y="415.0" font-size="25" fill="#173044" font-weight="700" text-anchor="start">改变运行的主体</text>
<text x="390" y="415.0" font-size="24" fill="#246ca6" font-weight="400" text-anchor="start">攻击者实施非授权控制操作</text>
<text x="980" y="415.0" font-size="24" fill="#b95822" font-weight="400" text-anchor="start">运营方下达停运决定</text>
<rect x="64" y="450" width="1472" height="85" rx="14" fill="#eef4f8" stroke="#d3dfe6" stroke-width="2"/>
<text x="86" y="500.0" font-size="25" fill="#173044" font-weight="700" text-anchor="start">关键连接环节</text>
<text x="390" y="500.0" font-size="24" fill="#246ca6" font-weight="400" text-anchor="start">已有控制功能 → 现场开关动作</text>
<text x="980" y="500.0" font-size="24" fill="#b95822" font-weight="400" text-anchor="start">范围不确定 → 隔离、遏制攻击</text>
