<text x="86" y="585.0" font-size="25" fill="#173044" font-weight="700" text-anchor="start">已确认的结果</text>
<text x="390" y="585.0" font-size="24" fill="#246ca6" font-weight="400" text-anchor="start">约225,000客户配电中断</text>
<text x="980" y="585.0" font-size="24" fill="#b95822" font-weight="400" text-anchor="start">管道停运、燃料运输受限</text>
<rect x="64" y="620" width="1472" height="85" rx="14" fill="#eef4f8" stroke="#d3dfe6" stroke-width="2"/>
<text x="86" y="670.0" font-size="25" fill="#173044" font-weight="700" text-anchor="start">恢复需要区分</text>
<text x="390" y="670.0" font-size="24" fill="#246ca6" font-weight="400" text-anchor="start">恢复送电／恢复可信远程控制</text>
<text x="980" y="670.0" font-size="24" fill="#b95822" font-weight="400" text-anchor="start">管道开始重启／终端供应恢复</text>
<text x="64" y="765.0" font-size="23" fill="#637383" font-weight="400" text-anchor="start">取证重点：前者查操作和设备反馈，后者查决策依据与运行依赖。</text>
