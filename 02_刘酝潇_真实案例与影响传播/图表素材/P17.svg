<text x="64" y="55.0" font-size="20" fill="#637383" font-weight="400" text-anchor="start">能源 × 网络安全  /  刘酝潇  /  P17</text>
<text x="64" y="115.0" font-size="38" fill="#173044" font-weight="700" text-anchor="start">同样的控制入侵，影响范围为什么可能不同？</text>
<text x="64" y="160.0" font-size="24" fill="#637383" font-weight="400" text-anchor="start">本组工程分析｜三个观察方向分别解释作用范围、供电后果和恢复速度</text>
