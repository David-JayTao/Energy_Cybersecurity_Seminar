<text x="452" y="278.0" font-size="27" fill="#637383" font-weight="700" text-anchor="start">只能查看／可操作单站／可操作多站</text>
<text x="452" y="321.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">不同条件可能改变同一异常操作的后果</text>
<rect x="1130" y="235" width="406" height="132" rx="14" fill="white" stroke="#16826c" stroke-width="2"/>
<text x="1152" y="278.0" font-size="27" fill="#16826c" font-weight="700" text-anchor="start">观察结果</text>
<text x="1152" y="321.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">决定可能被改变的对象范围</text>
