<rect x="430" y="585" width="640" height="132" rx="14" fill="white" stroke="#637383" stroke-width="2"/>
<text x="452" y="628.0" font-size="27" fill="#637383" font-weight="700" text-anchor="start">可信通信、现场人员、可用操作工具</text>
