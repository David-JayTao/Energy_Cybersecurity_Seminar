<text x="1152" y="628.0" font-size="27" fill="#16826c" font-weight="700" text-anchor="start">观察结果</text>
<text x="1152" y="671.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">影响发现、处置与恢复速度</text>
<line x1="374" y1="650" x2="428" y2="650" stroke="#246ca6" stroke-width="3" marker-end="url(#blue)"/>
<line x1="1070" y1="650" x2="1128" y2="650" stroke="#637383" stroke-width="3" marker-end="url(#gray)"/>
<text x="64" y="761.0" font-size="23" fill="#637383" font-weight="400" text-anchor="start">不提供虚构概率或评分；入侵范围、停电范围、停电时长不能相互替代。</text>
