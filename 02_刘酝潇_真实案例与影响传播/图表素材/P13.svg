chor="start">2016-03-18：联合研究报告</text><path d="M1000,610 L1070,610" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="1043.0" y="598.0" font-size="19" fill="#17324d" text-anchor="start"></text><text x="80" y="750" font-size="24" fill="#17324d" text-anchor="start">虚线：研究重建，首次入侵精确日期不明。供电恢复后自动化能力仍受限。</text><text x="60" y="850" font-size="19" fill="#657a8d" text-anchor="start">来源：R02 / R03  ｜本组重绘示意；完整书目与证据边界见逐页材料。</text></g></svg>