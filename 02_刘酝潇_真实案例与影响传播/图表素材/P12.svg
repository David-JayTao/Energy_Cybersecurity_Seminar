<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>P12 2015乌克兰：约22.5万客户经历配电中断</title><desc>事实卡仅展示日期、企业数、客户数及停电区间，不绘制无逐户数据的时长分布；恢复限制另列。</desc>
<defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#246ca6"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#b95822"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#16826c"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#637383"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#b43a42"/></marker></defs>
<rect width="1600" height="900" fill="#fafcfd"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .body{font-size:26px}</style>
<text x="64" y="55.0" font-size="20" fill="#637383" font-weight="400" text-anchor="start">能源 × 网络安全  /  刘酝潇  /  P12</text>
<text x="64" y="115.0" font-size="38" fill="#173044" font-weight="700" text-anchor="start">2015乌克兰：约22.5万客户经历配电中断</text>
<text x="64" y="160.0" font-size="24" fill="#637383" font-weight="400" text-anchor="start">事件规模与口径｜不把客户换成人数，不把区域配电中断扩大全国</text>
<line x1="64" y1="812" x2="1536" y2="812" stroke="#637383" stroke-width="1"/>
<text x="64" y="848.0" font-size="20" fill="#637383" font-weight="400" text-anchor="start">来源：R02 / R03  ·  完整定位见逐页文案与本部分书目</text>
<text x="64" y="879.0" font-size="18" fill="#637383" font-weight="400" text-anchor="start">2026-11-10  ·  本组重绘；图中比例不代表时间、概率或电气容量</text>
<rect x="64" y="225" width="720" height="150" rx="14" fill="white" stroke="#246ca6" stroke-width="2"/>
<text x="86" y="268.0" font-size="27" fill="#246ca6" font-weight="700" text-anchor="start">2015年12月23日</text>
<text x="86" y="311.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">事件发生日期；调查公开日期另算</text>
<rect x="816" y="225" width="720" height="150" rx="14" fill="white" stroke="#246ca6" stroke-width="2"/>
<text x="838" y="268.0" font-size="27" fill="#246ca6" font-weight="700" text-anchor="start">3家区域配电企业</text>
<text x="838" y="311.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">配电服务区域受影响</text>
<rect x="64" y="405" width="720" height="150" rx="14" fill="white" stroke="#246ca6" stroke-width="2"/>
<text x="86" y="448.0" font-size="27" fill="#246ca6" font-weight="700" text-anchor="start">约225,000个客户</text>
<text x="86" y="491.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">客户账户口径；不能换算居民人数</text>
<rect x="816" y="405" width="720" height="150" rx="14" fill="white" stroke="#246ca6" stroke-width="2"/>
<text x="838" y="448.0" font-size="27" fill="#246ca6" font-weight="700" text-anchor="start">约1–6小时</text>
<text x="838" y="491.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">不同受影响区域的停电时长范围</text>
<rect x="64" y="606" width="1472" height="110" rx="14" fill="white" stroke="#b95822" stroke-width="2"/>
<text x="86" y="649.0" font-size="27" fill="#b95822" font-weight="700" text-anchor="start">供电恢复后，自动化运行仍受限制</text>
<text x="86" y="692.0" font-size="24" fill="#173044" font-weight="400" text-anchor="start">停电时长与控制环境修复时长，是不同指标</text>
<text x="64" y="761.0" font-size="23" fill="#637383" font-weight="400" text-anchor="start">数据据R02与R03；R03引用R02等资料，两者不是完全独立的取证来源。</text>
</svg>