<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#447394"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="65" font-size="34" fill="#17324d" text-anchor="start">P12  2015乌克兰：已确认的是局部配电停电</text><text x="60" y="115" font-size="25" fill="#527189" text-anchor="start">明确时间、对象、客户与持续时间口径。</text><rect x="60" y="195" width="460.0" height="95" fill="#17324d" stroke="#ccd9e2"/><text x="72" y="225" font-size="22" fill="white" text-anchor="start">日期与对象</text><rect x="520.0" y="195" width="460.0" height="95" fill="#17324d" stroke="#ccd9e2"/><text x="532.0" y="225" font-size="22" fill="white" text-anchor="start">影响规模</text><rect x="980.0" y="195" width="460.0" height="95" fill="#17324d" stroke="#ccd9e2"/><text x="992.0" y="225" font-size="22" fill="white" text-anchor="start">恢复边界</text><rect x="60" y="290" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="72" y="320" font-size="22" fill="#17324d" text-anchor="start">2015-12-23</text><rect x="520.0" y="290" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="532.0" y="320" font-size="22" fill="#17324d" text-anchor="start">3家区域配电企业</text><rect x="980.0" y="290" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="992.0" y="320" font-size="22" fill="#17324d" text-anchor="start">局部配电事件</text><rect x="60" y="385" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="72" y="415" font-size="22" fill="#17324d" text-anchor="start">报告口径</text><rect x="520.0" y="385" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="532.0" y="415" font-size="22" fill="#17324d" text-anchor="start">约225000个客户</text><rect x="980.0" y="385" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="992.0" y="415" font-size="22" fill="#17324d" text-anchor="start">不能换算成居民人数</text><rect x="60" y="480" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="72" y="510" font-size="22" fill="#17324d" text-anchor="start">不同区域</text><rect x="520.0" y="480" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="532.0" y="510" font-size="22" fill="#17324d" text-anchor="start">停电约1–6小时</text><rect x="980.0" y="480" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="992.0" y="510" font-size="22" fill="#17324d" text-anchor="start">不是每户都停电6小时</text><rect x="60" y="575" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="72" y="605" font-size="22" fill="#17324d" text-anchor="start">供电恢复后</text><rect x="520.0" y="575" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="532.0" y="605" font-size="22" fill="#17324d" text-anchor="start">运行能力仍受限制</text><rect x="980.0" y="575" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="992.0" y="605" font-size="22" fill="#17324d" text-anchor="start">供能恢复不等于可信恢复</text><text x="60" y="850" font-size="19" fill="#657a8d" text-anchor="start">来源：R02 / R03 / R04  ｜本组重绘示意；完整书目与证据边界见逐页材料。</text></g></svg>