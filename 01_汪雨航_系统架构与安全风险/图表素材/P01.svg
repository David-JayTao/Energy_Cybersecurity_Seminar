<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#447394"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="65" font-size="34" fill="#17324d" text-anchor="start">P01  从网络入侵到物理影响：能源互联网的跨域安全风险与防御体系</text><text x="60" y="115" font-size="25" fill="#527189" text-anchor="start">判断风险，要追踪信息如何变成控制与供能结果。</text><rect x="65.0" y="300" width="425.0" height="160" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="85.0" y="338" font-size="25" fill="#17324d" text-anchor="start">连接与信任</text><text x="80.0" y="270" font-size="23" fill="#d17d25" text-anchor="start">01</text><rect x="525.0" y="300" width="425.0" height="160" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="545.0" y="338" font-size="25" fill="#17324d" text-anchor="start">控制与决策</text><text x="540.0" y="270" font-size="23" fill="#d17d25" text-anchor="start">02</text><rect x="985.0" y="300" width="425.0" height="160" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="1005.0" y="338" font-size="25" fill="#17324d" text-anchor="start">供能结果</text><text x="1000.0" y="270" font-size="23" fill="#d17d25" text-anchor="start">03</text><text x="70" y="580" font-size="25" fill="#17324d" text-anchor="start">核心判断：入侵、控制失效、供能中断是不同层次</text><text x="60" y="850" font-size="19" fill="#657a8d" text-anchor="start">来源：R01 / R02 / R07  ｜本组重绘示意；完整书目与证据边界见逐页材料。</text></g></svg>