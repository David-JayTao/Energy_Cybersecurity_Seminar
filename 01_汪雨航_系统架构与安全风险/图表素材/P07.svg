<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#447394"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="65" font-size="34" fill="#17324d" text-anchor="start">P07  光伏、储能与充电：从单设备风险到聚合风险</text><text x="60" y="115" font-size="25" fill="#527189" text-anchor="start">共同控制关系比设备数量更能解释影响范围。</text><rect x="80" y="195" width="420" height="100" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="100" y="233" font-size="25" fill="#17324d" text-anchor="start">光伏逆变器</text><path d="M500,245 L800,440" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="658.0" y="330.5" font-size="19" fill="#17324d" text-anchor="start"></text><rect x="80" y="355" width="420" height="100" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="100" y="393" font-size="25" fill="#17324d" text-anchor="start">储能EMS / BMS</text><path d="M500,405 L800,440" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="658.0" y="410.5" font-size="19" fill="#17324d" text-anchor="start"></text><rect x="80" y="515" width="420" height="100" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="100" y="553" font-size="25" fill="#17324d" text-anchor="start">充电平台与终端</text><path d="M500,565 L800,440" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" /><text x="658.0" y="490.5" font-size="19" fill="#17324d" text-anchor="start"></text><rect x="800" y="180" width="610" height="90" rx="10" fill="#edf4f9" stroke="#9ab2c8"/><text x="820" y="218" font-size="25" fill="#17324d" text-anchor="start">共同依赖：聚合平台 / 供应商更新</text><path d="M1090,270 L1090,385" fill="none" stroke="#447394" stroke-width="3" marker-end="url(#a)" stroke-dasharray="9 7"/><text x="1098.0" y="315.5" font-size="19" fill="#17324d" text-anchor="start">共享权限</text><rect x="800" y="385" width="610" height="110" rx="10" fill="#fff1df" stroke="#9ab2c8"/><text x="820" y="423" font-size="25" fill="#17324d" text-anchor="start">本地约束 → 聚合影响</text><text x="800" y="570" font-size="25" fill="#17324d" text-anchor="start">规模、同步性、工况决定后果；这是风险示意。</text><text x="60" y="850" font-size="19" fill="#657a8d" text-anchor="start">来源：R11 / R19  ｜本组重绘示意；完整书目与证据边界见逐页材料。</text></g></svg>