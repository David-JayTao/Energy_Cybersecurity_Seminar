<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#447394"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="65" font-size="34" fill="#17324d" text-anchor="start">P05  工业安全的目标：可信控制与安全连续运行</text><text x="60" y="115" font-size="25" fill="#527189" text-anchor="start">安全目标之间需要按过程后果权衡。</text><rect x="60" y="195" width="460.0" height="95" fill="#17324d" stroke="#ccd9e2"/><text x="72" y="225" font-size="22" fill="white" text-anchor="start">目标</text><rect x="520.0" y="195" width="460.0" height="95" fill="#17324d" stroke="#ccd9e2"/><text x="532.0" y="225" font-size="22" fill="white" text-anchor="start">失效例子</text><rect x="980.0" y="195" width="460.0" height="95" fill="#17324d" stroke="#ccd9e2"/><text x="992.0" y="225" font-size="22" fill="white" text-anchor="start">运行含义</text><rect x="60" y="290" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="72" y="320" font-size="22" fill="#17324d" text-anchor="start">保密性</text><rect x="520.0" y="290" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="532.0" y="320" font-size="22" fill="#17324d" text-anchor="start">凭据泄露</text><rect x="980.0" y="290" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="992.0" y="320" font-size="22" fill="#17324d" text-anchor="start">身份可能被冒用</text><rect x="60" y="385" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="72" y="415" font-size="22" fill="#17324d" text-anchor="start">完整性</text><rect x="520.0" y="385" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="532.0" y="415" font-size="22" fill="#17324d" text-anchor="start">测量或参数错误</text><rect x="980.0" y="385" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="992.0" y="415" font-size="22" fill="#17324d" text-anchor="start">判断与控制失去可信性</text><rect x="60" y="480" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="72" y="510" font-size="22" fill="#17324d" text-anchor="start">可用性 / 实时性</text><rect x="520.0" y="480" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="532.0" y="510" font-size="22" fill="#17324d" text-anchor="start">不可用 / 响应超时</text><rect x="980.0" y="480" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="992.0" y="510" font-size="22" fill="#17324d" text-anchor="start">需要时无法有效执行功能</text><rect x="60" y="575" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="72" y="605" font-size="22" fill="#17324d" text-anchor="start">可靠性 / 物理安全</text><rect x="520.0" y="575" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="532.0" y="605" font-size="22" fill="#17324d" text-anchor="start">供能中断 / 危险状态</text><rect x="980.0" y="575" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="992.0" y="605" font-size="22" fill="#17324d" text-anchor="start">结果层指标，不能仅看主机在线</text><text x="60" y="850" font-size="19" fill="#657a8d" text-anchor="start">来源：R01 / R23  ｜本组重绘示意；完整书目与证据边界见逐页材料。</text></g></svg>