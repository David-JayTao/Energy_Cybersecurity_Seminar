<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#447394"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="65" font-size="34" fill="#17324d" text-anchor="start">P09  从网络异常到物理后果，中间有条件</text><text x="60" y="115" font-size="25" fill="#527189" text-anchor="start">通信异常不是物理损坏的充分条件。</text><rect x="60" y="195" width="460.0" height="95" fill="#17324d" stroke="#ccd9e2"/><text x="72" y="225" font-size="22" fill="white" text-anchor="start">网络问题</text><rect x="520.0" y="195" width="460.0" height="95" fill="#17324d" stroke="#ccd9e2"/><text x="532.0" y="225" font-size="22" fill="white" text-anchor="start">可能运行影响</text><rect x="980.0" y="195" width="460.0" height="95" fill="#17324d" stroke="#ccd9e2"/><text x="992.0" y="225" font-size="22" fill="white" text-anchor="start">结果成立的条件</text><rect x="60" y="290" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="72" y="320" font-size="22" fill="#17324d" text-anchor="start">网络中断</text><rect x="520.0" y="290" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="532.0" y="320" font-size="22" fill="#17324d" text-anchor="start">远方监视与控制受限</text><rect x="980.0" y="290" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="992.0" y="320" font-size="22" fill="#17324d" text-anchor="start">本地功能、冗余与持续时间</text><rect x="60" y="385" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="72" y="415" font-size="22" fill="#17324d" text-anchor="start">数据错误</text><rect x="520.0" y="385" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="532.0" y="415" font-size="22" fill="#17324d" text-anchor="start">错误判断或设定</text><rect x="980.0" y="385" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="992.0" y="415" font-size="22" fill="#17324d" text-anchor="start">错误被采用且未被校验发现</text><rect x="60" y="480" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="72" y="510" font-size="22" fill="#17324d" text-anchor="start">控制不可用</text><rect x="520.0" y="480" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="532.0" y="510" font-size="22" fill="#17324d" text-anchor="start">降级或主动停运</text><rect x="980.0" y="480" width="460.0" height="95" fill="#eef4f7" stroke="#ccd9e2"/><text x="992.0" y="510" font-size="22" fill="#17324d" text-anchor="start">备用能力与安全运行要求</text><rect x="60" y="575" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="72" y="605" font-size="22" fill="#17324d" text-anchor="start">不当指令</text><rect x="520.0" y="575" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="532.0" y="605" font-size="22" fill="#17324d" text-anchor="start">设备状态改变</text><rect x="980.0" y="575" width="460.0" height="95" fill="#ffffff" stroke="#ccd9e2"/><text x="992.0" y="605" font-size="22" fill="#17324d" text-anchor="start">有效权限、执行路径、联锁与工况</text><text x="60" y="850" font-size="19" fill="#657a8d" text-anchor="start">来源：R01 / R02 / R07  ｜本组重绘示意；完整书目与证据边界见逐页材料。</text></g></svg>